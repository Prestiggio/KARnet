services:
  www:
    image: node:26.8.1-alpine
    container_name: katolika-main-website
    working_dir: /app
    ports:
      - "3000:3000"
      - "9230:9230"
    volumes:
      - .:/app
      - www_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CI: "true"
    command: sh -c "npm install && node --inspect=0.0.0.0:9229 ./node_modules/.bin/next dev"


volumes:
  www_node_modules:
