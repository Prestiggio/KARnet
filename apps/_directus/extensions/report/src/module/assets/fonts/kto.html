<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>kto</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 10px 20px;
            text-align: center;
        }
        .preview {
            width: 100px;
            display: inline-block;
            margin: 10px;
        }
        .preview .inner {
            display: inline-block;
            width: 100%;
            text-align: center;
            background: #f5f5f5;
            -webkit-border-radius: 3px 3px 0 0;
            -moz-border-radius: 3px 3px 0 0;
            border-radius: 3px 3px 0 0;
        }
        .preview .inner  {
            line-height: 85px;
            font-size: 40px;
            color: #333;
        }
        .label {
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            padding: 5px;
            font-size: 10px;
            font-family: Monaco, monospace;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: #ddd;
            -webkit-border-radius: 0 0 3px 3px;
            -moz-border-radius: 0 0 3px 3px;
            border-radius: 0 0 3px 3px;
            color: #666;
        }
    </style>

    <link rel="stylesheet" type="text/css" href="kto.css" />
</head>
<body>

    <h1>kto</h1>


        <div class="preview">
            <span class="inner">
                <i class="kto kto-school"></i>
            </span>
            <br>
            <span class='label'>school</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="kto kto-sakramenta"></i>
            </span>
            <br>
            <span class='label'>sakramenta</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="kto kto-money"></i>
            </span>
            <br>
            <span class='label'>money</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="kto kto-group"></i>
            </span>
            <br>
            <span class='label'>group</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="kto kto-eglizy"></i>
            </span>
            <br>
            <span class='label'>eglizy</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="kto kto-charity"></i>
            </span>
            <br>
            <span class='label'>charity</span>
        </div>


</body>
</html>
